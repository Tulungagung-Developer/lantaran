[workspace]
resolver = "3"
members = ["engine", "rules", "cli", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Tulungagung-Developer/lantaran"

[workspace.dependencies]
lantaran-engine = { path = "engine" }
lantaran-rules = { path = "rules" }
bytes = "1"
hudsucker = { version = "0.25", features = ["http2"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "logging", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
thiserror = "2"
time = "0.3"
tokio = "1"
# Pinned to the version uniffi-bindgen-cs targets, so the Windows app can
# share these bindings. Check its releases before moving to a newer uniffi.
uniffi = "0.32"
