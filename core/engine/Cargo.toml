[package]
name = "lantaran-engine"
description = "The Lantaran proxy engine: root CA, HTTP and HTTPS interception, flow events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lantaran-rules.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
gethostname.workspace = true
hudsucker.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
p12-keystore.workspace = true
pem.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "sync", "rt", "time"] }

[dev-dependencies]
flate2 = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "time"] }
