name: Feature
description: Something Lantaran should be able to do that it cannot do today.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Tulungagung-Developer/lantaran/issues/34) first. If the feature is already planned, comment on that issue instead.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves and who has it. Describe the situation, not the solution.
      placeholder: Phones often call a development server by IP address, and those requests cannot be decrypted.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to build
      description: The behaviour to add, as a list. Keep it to what a user or a front end can observe.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks that someone other than the author can run to see that it works.
      placeholder: "`curl -x http://127.0.0.1:9090 ...` prints ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for implementers
      description: Files to start from, constraints, and anything already known that would save the implementer time. Leave empty if you have none.
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issues that must be finished first, for example "#1, #6".
