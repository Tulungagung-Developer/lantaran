name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    env:
      # Lets aws-lc build on Windows runners, which have no NASM installed.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --no-report
      - name: Summarize
        run: |
          cargo llvm-cov report --summary-only | tee summary.txt
          {
            echo '### Test coverage'
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      # The threshold covers the libraries. The CLI's main.rs is argument
      # parsing and printing, and the uniffi-bindgen binary is three lines
      # that only run at build time; both would only dilute the number.
      # Raise the threshold as tests are added; it sits a few points below
      # the current value so it catches regressions, not small changes.
      - name: Check coverage threshold
        run: cargo llvm-cov report --ignore-filename-regex 'cli/src/|ffi/src/bin/' --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: core/lcov.info

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the engine and its Swift bindings
        run: apps/macos/scripts/build-core.sh --debug
      - name: Build the app
        run: swift build --package-path apps/macos
      - name: Test the app
        run: swift test --package-path apps/macos
